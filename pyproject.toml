[project]
name = "paymock"
version = "0.1.0"
description = "stripe-mock for African payments: stateful Paystack & Flutterwave sandboxes with signed webhooks, offline, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
paymock = "paymock.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paymock"]
